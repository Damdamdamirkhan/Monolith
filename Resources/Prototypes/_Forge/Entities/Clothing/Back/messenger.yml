#region Renegate
- type: entity
  parent: [ClothingBackpackMessenger, BaseC3Contraband]
  id: ClothingBackpackMessengerRenegade
  name: renegade messenger bag
  suffix: Ренегаты
  description: A sterile messenger bag with renegade colours.
  components:
  - type: Sprite
    sprite: _Forge/Clothing/Back/Messenger/renegade.rsi
  - type: ExplosionResistance # Corvax-Forge
    damageCoefficient: 0.9

#region Other
- type: entity
  parent: ClothingBackpackMessenger
  id: ClothingMilitaryMessenger
  name: army messenger
  description: A tactical messenger for army related needs.
  components:
  - type: Sprite
    sprite: _Forge/Clothing/Back/Messenger/military.rsi
  - type: Storage
    grid:
    - 0,0,1,1
    - 0,3,1,4
    - 3,0,6,3
    - 8,0,9,1
    - 8,3,9,4
    maxItemSize: Huge

- type: entity
  parent: ClothingBackpackMessenger
  id: ClothingBackpackMessengerCentcom
  name: messenger bag of holding CC
  description: A messenger bag that opens into a localized pocket of bluespace.
  components:
  - type: Sprite
    sprite: _Forge/Clothing/Back/Messenger/centcom.rsi
  - type: Storage
    maxItemSize: Huge
    grid:
    - 0,0,7,7

#Company branded
- type: entity # Forge-Change
  parent: ClothingBackpackMessengerContractor
  id: ClothingBackpackMessengerNexus
  name: Nexus messenger bag
  components:
  - type: Sprite
    sprite: _NF/Clothing/Back/Messenger/color.rsi
    layers:
    - state: icon-base
      color: "#2a3b63"
    - state: icon-base-top
      color: "#98acc2"
    - state: icon-sling
      color: "#3b4360"
    - state: icon-clasp
      color: "#e1af4e"
  - type: Clothing
    sprite: _NF/Clothing/Back/Messenger/color.rsi
    clothingVisuals:
      back:
      - state: base-equipped-BACKPACK
        color: "#2a3b63"
      - state: base-top-equipped-BACKPACK
        color: "#98acc2"
      - state: sling-equipped-BACKPACK
        color: "#3b4360"
      - state: clasp-equipped-BACKPACK
        color: "#e1af4e"
  - type: Item
    inhandVisuals:
      left:
      - state: base-inhand-left
        color: "#2a3b63"
      - state: base-top-inhand-left
        color: "#98acc2"
      - state: clasp-inhand-left
        color: "#e1af4e"
      right:
      - state: base-inhand-right
        color: "#2a3b63"
      - state: base-top-inhand-right
        color: "#98acc2"
      - state: clasp-inhand-right
        color: "#e1af4e"
